aid: 1touch-io
name: 1touch.io
description: '1touch.io is an enterprise data-security and data-intelligence vendor
  whose Kontxtual platform (previously shipped as Inventa) performs automated, near
  real-time discovery, classification, mapping and cataloging of sensitive data across
  cloud, on-premises, SaaS and IBM z/OS mainframe environments. The platform combines
  passive network analysis, ML/NLP classification and an LLM-driven contextual graph
  to deliver enterprise DSPM, attribute-based access control, access intelligence,
  DLP for streaming data, mainframe security posture management, cryptographic discovery
  and AI security. The technology is also OEM-distributed by IBM as Guardium Discover
  and Classify. Everpure (formerly Pure Storage, NYSE: PSTG) completed its acquisition
  of 1touch.io on 2026-05-11. Product documentation is published to a MadCap Central
  portal that requires a customer login, and no public developer portal, API reference
  or machine-readable specification is available.'
